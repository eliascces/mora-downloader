name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests unitarios
        run: npm test
      - name: Descargar binarios (yt-dlp, ffmpeg, deno)
        run: npm run setup:binaries
      - name: Prueba end-to-end real
        continue-on-error: true
        run: node scripts/e2e.js

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validar tag vs versión
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $ver = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($tag -ne $ver) {
            Write-Error "El tag v$tag no coincide con package.json ($ver)"
            exit 1
          }
      - name: Descargar binarios
        run: npm run setup:binaries
      - name: Compilar portable + instalador
        run: npm run dist
      - name: Subir artefactos
        uses: actions/upload-artifact@v7
        with:
          name: MoraDownloader-windows
          path: dist/MoraDownloader*.exe
      - name: Crear Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/MoraDownloader*.exe
          generate_release_notes: true