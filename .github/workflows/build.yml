name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests unitarios
        run: npm test
      - name: Descargar binarios (yt-dlp, ffmpeg, deno)
        run: npm run setup:binaries
      - name: Prueba end-to-end real
        run: node scripts/e2e.js

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Descargar binarios
        run: npm run setup:binaries
      - name: Compilar .exe portable
        run: npm run dist
      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: MoraDownloader-1.0.0.exe
          path: dist/MoraDownloader-1.0.0.exe
      - name: Crear Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MoraDownloader-1.0.0.exe
          generate_release_notes: true