appId: com.mora.downloader
productName: Mora Downloader
directories:
  output: dist
  buildResources: build
files:
  - src/**
  - package.json
extraResources:
  - from: assets/resources
    to: resources
    filter:
      - "**/*"
      - "!ffplay.exe"
win:
  icon: assets/icon.ico
  target:
    - target: portable
      arch:
        - x64
    - target: nsis
      arch:
        - x64
portable:
  artifactName: "MoraDownloader-${version}.exe"
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Mora Downloader
  artifactName: "MoraDownloader-Setup-${version}.exe"
npmRebuild: false
